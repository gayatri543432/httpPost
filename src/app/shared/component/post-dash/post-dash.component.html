
<div class="row mb-3">
    <div class="col-md-6 offset-md-3">
        <app-post-form
        (emitPost)="onPostSubmit($event)"
        (updatePost)="onUpdate($event)"
        ></app-post-form>
    </div>
</div>

<div class="row">
    <div class="col-md-4 mb-5" *ngFor="let post of postArr">
        <app-post-card 
        [postObj]="post"
        (emitRemovePost)="onRemove($event)"
        ></app-post-card>
    </div>
</div>
